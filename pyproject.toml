[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "library-bus-project"
version = "2.0.0"
description = "Hệ thống Quản lý và Điều hành Mạng lưới Xe Bus Thư Viện Lưu Động"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Library Bus Team" }
]
dependencies = [
    "Django==5.2.4",
    "django-jazzmin==3.0.5",
    "django-rangefilter==0.9.1",
    "django-admin-rangefilter==0.13.3",
    "django-crispy-forms==2.4",
    "mysqlclient==2.2.7",
    "redis==6.2.0",
    "django-redis==6.0.0",
    "celery==5.5.3",
    "whitenoise==6.12.0",
    "gunicorn==26.0.0",
    "argon2-cffi==25.1.0",
    "python-dotenv==1.2.2",
    "pillow==11.3.0",
    "google-generativeai==0.8.5",
    "requests==2.32.4",
    "user-agents==2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-django==4.11.1",
    "factory_boy==3.3.3",
    "Faker==37.4.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "migrations",
    ".git",
    "__pycache__",
    "venv",
    "env",
    "mta"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "library_bus_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short -ra"
