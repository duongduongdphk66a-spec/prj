  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-main: #060911;
      --bg-card: #0B1120;
      --accent-cyan: #38BDF8;
      --accent-blue: #0284C7;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;
      --accent-purple: #A855F7;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Header Bar */
    header.top-bar {
      height: 56px;
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .brand-text h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn-record {
      background: linear-gradient(135deg, #E11D48, #BE123C);
      border: none;
      color: white;
      box-shadow: 0 0 16px rgba(225, 29, 72, 0.45);
    }

    .btn-record:hover {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
      transform: translateY(-1px);
    }

    .btn-record.recording {
      animation: pulseRecord 1.2s infinite;
      background: #E11D48;
    }

    @keyframes pulseRecord {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }

    /* Main Video Stage */
    main.video-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      position: relative;
      background: radial-gradient(circle at center, #0F172A 0%, #060911 100%);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 1600px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 180px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    canvas#presentation-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Subtitles overlay */
    .subtitles-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      background: rgba(6, 9, 17, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border-radius: 10px;
      padding: 10px 22px;
      text-align: center;
      color: #FFFFFF;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      transition: all 0.3s;
      z-index: 10;
    }

    /* Bottom Control Bar */
    footer.control-bar {
      height: 74px;
      background: rgba(11, 17, 32, 0.98);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      z-index: 50;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--accent-cyan);
    }

    .btn-play-pause {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284C7, #0369A1);
      border: none;
      color: white;
      font-size: 18px;
      box-shadow: 0 0 16px rgba(2, 132, 199, 0.4);
    }

    .btn-play-pause:hover {
      background: linear-gradient(135deg, #38BDF8, #0284C7);
      transform: scale(1.05);
    }

    .timeline-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timeline-scrubber {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .timeline-progress {
      height: 100%;
      background: linear-gradient(90deg, #0284C7, #38BDF8, #10B981);
      width: 0%;
      border-radius: 4px;
      transition: width 0.15s linear;
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    .voice-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .voice-toggle input {
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .speed-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      outline: none;
    }

    .speed-select option {
      background: #0F172A;
      color: white;
    }

    .scene-jump {
      display: flex;
      gap: 4px;
      max-width: 320px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-pill.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-cyan);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon">🚌</div>
      <div class="brand-text">
        <h1>LIBRARY BUS • VIDEO GIẢI THÍCH KIẾN TRÚC & SƠ ĐỒ MINH HỌA</h1>
        <span>Phân tích trực quan 10 Cảnh Kiến trúc, ERD, Concurrency & Hàng đợi Celery</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-action" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
      <button class="btn-action btn-record" id="btn-record" onclick="toggleRecording()">
        🔴 Ghi & Tải Video (.webm)
      </button>
    </div>
  </header>

  <!-- Video Stage -->
  <main class="video-stage">
    <div class="canvas-container" id="canvas-container">
      <canvas id="presentation-canvas" width="1920" height="1080"></canvas>
      <div class="subtitles-bar" id="subtitle-box">
        Đang khởi động trình phát video kiến trúc với sơ đồ minh họa chuyên sâu...
      </div>
    </div>
  </main>

  <!-- Control Bar -->
  <footer class="control-bar">
    <div class="playback-controls">
      <button class="btn-ctrl" title="Cảnh trước" onclick="prevScene()">⏮</button>
      <button class="btn-ctrl btn-play-pause" id="play-pause-btn" title="Phát/Dừng" onclick="togglePlayPause()">▶</button>
      <button class="btn-ctrl" title="Cảnh sau" onclick="nextScene()">⏭</button>
    </div>

    <div class="timeline-container">
      <div class="timeline-scrubber" id="timeline-scrubber" onclick="seekTimeline(event)">
        <div class="timeline-progress" id="progress-fill"></div>
      </div>
      <div class="timeline-meta">
        <span id="time-current">00:00</span>
        <span id="slide-info">Cảnh 1 / 10: Tổng quan & Mô hình Vận hành Thực tế</span>
        <span id="time-total">03:15</span>
      </div>
    </div>

    <div class="scene-jump" id="scene-pills"></div>

    <label class="voice-toggle">
      <input type="checkbox" id="chk-voice" checked onchange="toggleVoice(this.checked)">
      🔊 Lồng tiếng Việt (TTS)
    </label>

    <select class="speed-select" id="speed-select" onchange="changeSpeed(this.value)">
      <option value="0.85">0.85x</option>
      <option value="1.0" selected>1.0x (Chuẩn)</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
    </select>
  </footer>

    // Canvas Utility Helpers
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawPanel(ctx, x, y, w, h, title, color) {
      // Panel BG
      ctx.fillStyle = "rgba(11, 17, 32, 0.92)";
      roundRect(ctx, x, y, w, h, 14, true, false);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, w, h, 14, false, true);

      // Panel Header
      ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
      roundRect(ctx, x, y, w, 46, 14, true, false);
      ctx.fillStyle = color;
      ctx.fillRect(x + 18, y + 14, 8, 18);

      ctx.fillStyle = "#F8FAFC";
      ctx.font = "bold 15px 'Plus Jakarta Sans'";
      ctx.fillText(title, x + 36, y + 28);
    }

    function drawArrow(ctx, x1, y1, x2, y2, color, pulseOffset) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.lineDashOffset = -pulseOffset;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // Arrow head
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - 10 * Math.cos(angle - Math.PI / 6), y2 - 10 * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - 10 * Math.cos(angle + Math.PI / 6), y2 - 10 * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawNodeBox(ctx, x, y, w, h, title, sub, color, borderCol) {

      roundRect(ctx, x, y, w, h, 8, true, false);

      ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, w, h, 8, false, true);

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 15px 'Plus Jakarta Sans'";
      ctx.fillText(title, x + 14, y + 24);

      if (sub) {
        ctx.fillStyle = "#CBD5E1";
        ctx.font = "500 12px 'JetBrains Mono'";
        ctx.fillText(sub, x + 14, y + 42);
      }
    }

    // Diagram 3: Concentric Radar Diagram
    function drawConcentricRadarDiagram(x, y, w, h, anim) {
      drawPanel(ctx, x, y, w, h, "BẢN ĐỒ RADAR 6 QUỸ ĐẠO ĐỒNG TÂM (702 NODES & 1.303 EDGES)", "#F59E0B");

      const cx = x + w / 2;
      const cy = y + h / 2 + 10;
      const rings = [
        { r: 45, name: "Core & Config", col: "#38BDF8" },
        { r: 90, name: "Models & DB", col: "#10B981" },
        { r: 140, name: "Services & Tasks", col: "#F59E0B" },
        { r: 190, name: "Views & Admin", col: "#A855F7" },
        { r: 240, name: "Testing & QA", col: "#F43F5E" },
        { r: 285, name: "Templates & UI", col: "#0284C7" }
      ];

      // Draw Rings
      rings.forEach((ring, i) => {
        ctx.save();
        ctx.strokeStyle = ring.col + "40";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
        ctx.stroke();

        // Ring Label
        ctx.fillStyle = ring.col;
        ctx.font = "bold 11px 'JetBrains Mono'";
        ctx.fillText(ring.name, cx + ring.r - 35, cy - 6);
        ctx.restore();
      });

      // Rotating Scanner Beam
      const angle = (anim * 1.5) % (Math.PI * 2);
      ctx.save();
      const sweepGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 290);
      sweepGrad.addColorStop(0, "rgba(245, 158, 11, 0.4)");
      sweepGrad.addColorStop(1, "rgba(245, 158, 11, 0.0)");
      ctx.fillStyle = sweepGrad;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, 285, angle - 0.35, angle);
      ctx.closePath();
      ctx.fill();

      // Scanner Line
      ctx.strokeStyle = "#F59E0B";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * 285, cy + Math.sin(angle) * 285);
      ctx.stroke();
      ctx.restore();

      // Dynamic Node Dots on Rings
      for (let i = 0; i < 48; i++) {
        const ringIdx = i % rings.length;
        const radius = rings[ringIdx].r;
        const nodeAngle = (i * 1.35) + (anim * 0.1 * (ringIdx % 2 === 0 ? 1 : -1));
        const nx = cx + Math.cos(nodeAngle) * radius;
        const ny = cy + Math.sin(nodeAngle) * radius;

        ctx.fillStyle = rings[ringIdx].col;
        ctx.beginPath();
        ctx.arc(nx, ny, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Center Core Dot
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();

      // Radar Legend Box
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      roundRect(ctx, x + 25, y + h - 80, w - 50, 56, 8, true, false);
      ctx.fillStyle = "#F8FAFC";
      ctx.font = "bold 13px 'JetBrains Mono'";
      ctx.fillText("TỔNG SỐ: 219 FILES • 288 CLASSES • 179 FUNCTIONS • 18 RELATIONSHIP TYPES", x + 40, y + h - 46);
    }

    // Main Canvas Render Loop
    function render() {
      animPulse += 0.04;
      const scene = SCENES[currentSceneIdx];
      if (!scene) return;

      const w = canvas.width;
      const h = canvas.height;

      // Dark Tech Background
      ctx.fillStyle = "#060911";
      ctx.fillRect(0, 0, w, h);

      // Subtle Background Grid
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.025)";
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.restore();

      // Top Presentation Bar
      ctx.fillStyle = "#0B1120";
      ctx.fillRect(0, 0, w, 70);
      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      ctx.fillRect(0, 69, w, 1);

      // Tag Badge
      ctx.fillStyle = scene.color;
      roundRect(ctx, 40, 16, 320, 38, 7, true, false);
      ctx.fillStyle = "#000000";
      ctx.font = "bold 14px 'JetBrains Mono'";
      ctx.fillText(scene.tag, 58, 41);

      ctx.fillStyle = "#94A3B8";
      ctx.font = "600 16px 'Plus Jakarta Sans'";
      ctx.fillText("HỆ THỐNG TỦ SÁCH LƯU ĐỘNG — BẢN ĐỒ KIẾN TRÚC & SƠ ĐỒ THIẾT KẾ", 380, 41);

      ctx.fillStyle = "#F8FAFC";
      ctx.font = "bold 16px 'JetBrains Mono'";
      ctx.fillText(`CẢNH ${currentSceneIdx + 1} / ${SCENES.length}`, w - 170, 41);

      // ==========================================
      // LEFT COLUMN: EXPLANATION & BULLETS (w: 780px)
      // ==========================================
      const leftX = 40;
      const leftY = 95;
      const leftW = 810;
      const leftH = h - 170;

      ctx.fillStyle = "rgba(11, 17, 32, 0.88)";
      roundRect(ctx, leftX, leftY, leftW, leftH, 14, true, false);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      roundRect(ctx, leftX, leftY, leftW, leftH, 14, false, true);

      // Left Color Accent Stripe
      ctx.fillStyle = scene.color;
      roundRect(ctx, leftX, leftY, 12, leftH, 7, true, false);

      // Title
      ctx.fillStyle = "#F8FAFC";
      ctx.font = "800 40px 'Plus Jakarta Sans'";
      ctx.fillText(scene.title, leftX + 40, leftY + 65);

      // Subtitle
      ctx.fillStyle = scene.color;
      ctx.font = "600 20px 'Plus Jakarta Sans'";
      ctx.fillText(scene.subtitle, leftX + 42, leftY + 105);

      // Divider
      ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
      ctx.fillRect(leftX + 42, leftY + 125, leftW - 80, 1.5);

      // Bullets
      let by = leftY + 175;
      scene.bullets.forEach((b, i) => {
        // Bullet Card
        ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
        roundRect(ctx, leftX + 42, by - 30, leftW - 84, 58, 8, true, false);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        roundRect(ctx, leftX + 42, by - 30, leftW - 84, 58, 8, false, true);

        // Number bullet badge
        ctx.fillStyle = scene.color;
        roundRect(ctx, leftX + 54, by - 20, 28, 28, 6, true, false);
        ctx.fillStyle = "#000000";
        ctx.font = "bold 14px 'JetBrains Mono'";
        ctx.fillText(String(i + 1), leftX + 63, by - 1);

        // Bullet Text
        ctx.fillStyle = "#E2E8F0";
        ctx.font = "500 17px 'Plus Jakarta Sans'";
        ctx.fillText(b, leftX + 96, by);

        by += 72;
      });

      // Code Tag Banner
      ctx.fillStyle = "#020617";
      roundRect(ctx, leftX + 42, leftY + leftH - 80, leftW - 84, 52, 8, true, false);
      ctx.strokeStyle = scene.color;
      roundRect(ctx, leftX + 42, leftY + leftH - 80, leftW - 84, 52, 8, false, true);

      ctx.fillStyle = scene.color;
      ctx.font = "bold 15px 'JetBrains Mono'";
      ctx.fillText(`⚡ ${scene.codeTag}`, leftX + 65, leftY + leftH - 48);

      // ==========================================
      // RIGHT COLUMN: LIVE DIAGRAM ENGINE (w: 990px)
      // ==========================================
      const rightX = 880;
      const rightY = 95;
      const rightW = w - rightX - 40;
      const rightH = leftH;

      drawDiagram(scene.diagramType, rightX, rightY, rightW, rightH, animPulse);

      // Bottom Watermark
      ctx.fillStyle = "#64748B";
      ctx.font = "500 14px 'Plus Jakarta Sans'";
      ctx.fillText("Django 5.2 • Celery 5.5 • Redis 7 • MySQL 8.0 • Interactive Architecture Diagrams", 40, h - 25);

      ctx.fillStyle = scene.color;
      ctx.font = "bold 14px 'JetBrains Mono'";
      ctx.fillText("understand_dashboard.html", w - 240, h - 25);

      // Loop animation
      animFrameId = requestAnimationFrame(render);
    }

    // Playback and Scene Management
    function startScene(idx) {
      currentSceneIdx = idx;
      updatePills(idx);

      const scene = SCENES[idx];
      subtitleBox.textContent = scene.narration;
      slideInfo.textContent = `Cảnh ${idx + 1} / ${SCENES.length}: ${scene.title}`;

      const elapsed = SCENES.slice(0, idx).reduce((acc, s) => acc + s.durationSeconds, 0);
      timeCurrent.textContent = formatTime(elapsed);
      progressFill.style.width = `${((idx + 1) / SCENES.length) * 100}%`;

      if (!isPlaying) return;

      clearTimeout(sceneTimer);
      const durationMs = (scene.durationSeconds / playbackRate) * 1000;

      speakNarration(scene.narration);

      sceneTimer = setTimeout(() => {
        if (!isPlaying) return;
        if (currentSceneIdx < SCENES.length - 1) {
          startScene(currentSceneIdx + 1);
        } else {
          stopVideo();
          if (isRecording) stopRecording();
        }
      }, durationMs);
    }

    function speakNarration(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = playbackRate * 1.02;
      utterance.pitch = 1.0;

      currentSpeechUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    function playVideo() {
      isPlaying = true;
      playPauseBtn.textContent = '⏸';
      startScene(currentSceneIdx);
    }

    function pauseVideo() {
      isPlaying = false;
      playPauseBtn.textContent = '▶';
      clearTimeout(sceneTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function stopVideo() {
      pauseVideo();
      currentSceneIdx = 0;
      updatePills(0);
      progressFill.style.width = '0%';
    }

    function togglePlayPause() {
      if (isPlaying) pauseVideo();
      else playVideo();
    }

    function nextScene() {
      if (currentSceneIdx < SCENES.length - 1) {
        startScene(currentSceneIdx + 1);
      }
    }

    function prevScene() {
      if (currentSceneIdx > 0) {
        startScene(currentSceneIdx - 1);
      }
    }

    function jumpToScene(idx) {
      startScene(idx);
    }

    function seekTimeline(e) {
      const scrubber = document.getElementById('timeline-scrubber');
      const rect = scrubber.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const targetIdx = Math.min(SCENES.length - 1, Math.max(0, Math.floor(ratio * SCENES.length)));
      jumpToScene(targetIdx);
    }

    function toggleVoice(enabled) {
      voiceEnabled = enabled;
      if (!enabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else if (enabled && isPlaying) {
        speakNarration(SCENES[currentSceneIdx].narration);
      }
    }

    function changeSpeed(rate) {
      playbackRate = parseFloat(rate);
      if (isPlaying) {
        startScene(currentSceneIdx);
      }
    }

    function toggleFullscreen() {
      const container = document.getElementById('canvas-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // MediaRecorder Video Export
    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      try {
        const stream = canvas.captureStream(60);
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp9',
          videoBitsPerSecond: 6000000
        });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = exportVideoFile;

        mediaRecorder.start();
        isRecording = true;
        btnRecord.classList.add('recording');
        btnRecord.textContent = '⏹ Đang Ghi... Nhấn Để Lưu Video';

        // Play from start
        currentSceneIdx = 0;
        playVideo();
      } catch (err) {
        alert("Lỗi khi khởi động MediaRecorder: " + err.message + "\nHãy thử lại trên trình duyệt Google Chrome hoặc Edge.");
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      btnRecord.classList.remove('recording');
      btnRecord.textContent = '🔴 Ghi & Tải Video (.webm)';
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      pauseVideo();
    }

    function exportVideoFile() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `video_giai_thich_kien_truc_library_bus.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 2000);
      alert("🎉 Đã xuất và tải thành công video giải thích kiến trúc: video_giai_thich_kien_truc_library_bus.webm");
    }

    // Start initial render
    render();
    startScene(0);
  </script>
</body>
