<!-- File: inventory/bus_list.html -->
{% extends "base.html" %}
{% load static %}

{% block title %}Danh sách Xe Bus - {{ block.super }}{% endblock %}

{% block extra_css %}
{{ block.super }}
<style>
/* Leaflet Map Styling */
.map-container {
    height: calc(100vh - 120px);
    width: 100%;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    position: relative;
    z-index: 1;
    border: 1px solid var(--border-color);
}

#bus-map {
    height: 100%;
    width: 100%;
    z-index: 1;
}

.map-search-overlay {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1000;
    width: 360px;
    background: var(--bg-surface);
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 4px 18px;
}

.map-search-input {
    border: none;
    outline: none;
    padding: 10px 12px;
    width: 100%;
    font-size: 14.5px;
    background: transparent;
    color: var(--text-primary);
}

.map-search-icon {
    color: var(--color-roast);
    font-size: 1.1rem;
}

.leaflet-popup-content-wrapper {
    border-radius: var(--radius-md) !important;
    box-shadow: var(--shadow-lg) !important;
    background: var(--bg-surface) !important;
    color: var(--text-primary) !important;
    border: 1px solid var(--border-color) !important;
}
.leaflet-popup-content {
    margin: 16px !important;
}
.bus-popup-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--color-molasses);
    font-family: var(--font-display);
}
[data-theme="dark"] .bus-popup-title { color: var(--text-primary); }
.bus-popup-status {
    font-size: 0.8rem;
    margin-bottom: 10px;
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    background: var(--color-success-bg);
    color: var(--color-success);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.bus-popup-btn {
    display: block;
    text-align: center;
    background: var(--gradient-primary);
    color: #FFFDF9 !important;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    margin-top: 12px;
    transition: all var(--transition-spring);
    box-shadow: var(--shadow-xs);
}
.bus-popup-btn:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
{% endblock %}

{% block content %}
<div class="map-container">
    <!-- Nút tìm kiếm nổi trên map -->
    <div class="map-search-overlay">
        <i class="fas fa-search map-search-icon"></i>
        <input type="text" id="bus-search-input" class="map-search-input" placeholder="Tìm kiếm xe theo tên...">
    </div>
    
    <!-- Vùng hiển thị bản đồ -->
    <div id="bus-map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const busesData = {{ buses_json|safe }};
        
        // Khởi tạo map, mặc định giữa Việt Nam (nếu không có xe nào)
        let defaultLat = 21.028511; // Hanoi
        let defaultLng = 105.804817;
        
        if (busesData && busesData.length > 0) {
            defaultLat = busesData[0].lat;
            defaultLng = busesData[0].lng;
        }

        const map = L.map('bus-map').setView([defaultLat, defaultLng], 12);

        // Thêm tile layer từ OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Custom marker icon cho xe bus (Taste-Skill Accent Pin)
        const busIcon = L.divIcon({
            html: '<div style="background: #BD5705; color: #FFFDF9; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(189,87,5,0.45); border: 2px solid #FFFDF9;"><i class="fas fa-bus" style="font-size: 16px;"></i></div>',
            className: 'custom-bus-icon',
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -36]
        });

        // Array lưu các marker để thao tác tìm kiếm
        const markers = [];

        // Duyệt danh sách xe để vẽ marker
        if (busesData) {
            busesData.forEach(bus => {
                const popupContent = `
                    <div class="bus-popup-title">${bus.name}</div>
                    <div class="bus-popup-status">${bus.status}</div>
                    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">
                        <i class="fas fa-map-marker-alt text-warning me-1"></i> ${bus.location_name || 'Đang cập nhật'}
                    </div>
                    <a href="${bus.detail_url}" class="bus-popup-btn">Xem chi tiết</a>
                `;

                const marker = L.marker([bus.lat, bus.lng], { icon: busIcon })
                    .bindPopup(popupContent)
                    .addTo(map);
                    
                markers.push({
                    marker: marker,
                    name: bus.name.toLowerCase(),
                    lat: bus.lat,
                    lng: bus.lng
                });
            });
        }

        // Tính năng tìm kiếm xe
        const searchInput = document.getElementById('bus-search-input');
        if(searchInput) {
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                let found = false;

                markers.forEach(item => {
                    if (item.name.includes(query) && query.length > 0) {
                        if (!found) {
                            // Di chuyển bản đồ đến xe đầu tiên tìm thấy và mở popup
                            map.flyTo([item.lat, item.lng], 15);
                            item.marker.openPopup();
                            found = true;
                        }
                    }
                });
            });
        }
    });
</script>
{% endblock %}
