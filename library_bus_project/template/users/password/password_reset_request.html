<!-- users/password_reset_request.html -->
{% extends "base.html" %}
{% block title %}Yêu cầu đặt lại mật khẩu{% endblock %}
{% block content %}
<div class="content-header"><h2>Đặt lại mật khẩu</h2></div>
<div class="card"><div class="card-body">
    <p>Nhập địa chỉ email đã đăng ký của bạn. Chúng tôi sẽ gửi cho bạn một liên kết để đặt lại mật khẩu.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Gửi email</button>
    </form>
</div></div>
{% endblock %}
