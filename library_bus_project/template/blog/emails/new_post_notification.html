<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2>Bài viết mới cần duyệt</h2>
    <p>Xin chào Admin,</p>
    <p>Có một bài viết mới từ <strong>{{ author.get_full_name|default:author.username }}</strong> đang chờ bạn phê duyệt.</p>
    
    <div style="background-color: #f9f9f9; border-left: 4px solid #d4af37; padding: 15px; margin: 20px 0;">
        <h3 style="margin-top: 0;">{{ post.title }}</h3>
        <p>{{ post.excerpt|default:post.content|truncatewords:50 }}</p>
    </div>

    <p style="text-align: center; margin: 30px 0;">
        <a href="{{ admin_url }}" style="background-color: #d4af37; color: #2c1810; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">
            Xem và Duyệt bài
        </a>
    </p>
    <p>Nếu nút trên không hoạt động, copy đường dẫn này: <br>{{ admin_url }}</p>
</body>
</html>
