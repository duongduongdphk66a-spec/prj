{% load static %}
<div class="comment-item" id="comment-{{ comment.id }}">
    <div class="comment-header d-flex justify-content-between align-items-center mb-2">
        <div class="d-flex align-items-center">
            {% if comment.author.profile.avatar %}
                <img src="{{ comment.author.profile.avatar.url }}" alt="Avatar" class="rounded-circle mr-2" style="width: 32px; height: 32px; object-fit: cover;">
            {% else %}
                <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center mr-2" style="width: 32px; height: 32px;">
                    {{ comment.author.username|make_list|first|upper }}
                </div>
            {% endif %}
            <span class="font-weight-bold">{{ comment.author.username }}</span>
            <span class="text-muted small ml-2">{{ comment.created_at|timesince }} trước</span>
        </div>
    </div>
    
    <div class="comment-content mb-2">
        {{ comment.content|linebreaks }}
    </div>
</div>
